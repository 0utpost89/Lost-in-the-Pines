<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Lost in the Pines</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0f24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lost in the Pines">
<link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
<link rel="icon" type="image/png" href="icon-192.png" sizes="192x192">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0a0f24; --ink:#eaf6ff; --dim:#9fb3c8; --teal:#19e3c5; --pink:#ff3d9a; --sun:#ffd23f; --violet:#6a3df5;
  --panel:rgba(10,15,36,.9);
  --osd:"VT323","Courier New",monospace; --display:"Bungee","Impact","Arial Black",sans-serif;
  color-scheme:dark;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
/* The game is a night scene in both themes, so the tokens keep the same values. */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --night:#0a0f24; --ink:#eaf6ff; color-scheme:dark; } }
:root[data-theme="dark"]{ --night:#0a0f24; --ink:#eaf6ff; color-scheme:dark; }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--ink);overflow:hidden;overscroll-behavior:none;font-family:var(--osd);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.05) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
.hide{display:none!important}

#hud{position:absolute;inset:0;pointer-events:none;font-size:22px;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.65)}
.top{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 12px 6px;gap:8px}
#hearts{color:var(--pink);font-size:28px;letter-spacing:2px}
#night{color:var(--dim);margin-top:4px}
.bar2{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 12px}
#parts{display:flex;gap:4px}
#parts canvas{width:30px;height:30px;border-radius:50%;background:rgba(10,15,36,.65);border:2px solid rgba(255,255,255,.18);opacity:.45;filter:grayscale(1)}
#parts canvas.carry{opacity:1;filter:none;border-color:var(--sun)}
#parts canvas.bank{opacity:1;filter:none;border-color:var(--teal);background:rgba(25,227,197,.28)}
.r{display:flex;gap:10px;align-items:center}
#score{font-size:30px;color:var(--sun);min-width:2ch;text-align:right}
#bPause{pointer-events:auto;width:40px;height:40px;border-radius:8px;border:2px solid rgba(255,255,255,.3);background:rgba(10,15,36,.6);font-size:22px;padding:0}
#ebar{flex:1 1 60px;max-width:170px;height:9px;background:rgba(255,255,255,.14);border-radius:5px;overflow:hidden}
#ebar i{display:block;height:100%;background:var(--teal);transform-origin:left center}
#ebar.low i{background:var(--pink)}
#bag{padding:5px 12px 0;color:var(--dim);font-size:20px}
#leads{text-align:left;margin:6px 0 2px}
#leads p{font-size:21px;margin:7px 0;color:var(--ink)}
#combo{position:absolute;right:12px;top:186px;color:var(--pink);font-size:32px}
#phase{position:absolute;left:0;right:0;top:126px;text-align:center;color:var(--teal);font-size:26px;padding:0 12px}
#toast{position:absolute;left:50%;top:24%;transform:translateX(-50%);width:max-content;max-width:86%;text-align:center;background:var(--panel);
  border:2px solid var(--teal);padding:9px 14px;border-radius:6px;font-size:24px;line-height:1.05;opacity:0;transition:opacity .25s}
#toast.on{opacity:1}
#rose{position:absolute;left:12px;bottom:14px;width:60px;height:60px;opacity:.38}
#bTalk{pointer-events:auto;position:absolute;left:0;top:0;margin:0;padding:7px 14px;font:22px var(--osd);white-space:nowrap;color:var(--ink);background:rgba(10,15,36,.88);border:2px solid var(--sun);border-radius:999px;text-shadow:none}
#bTalk:active{background:rgba(255,210,63,.3)}
#rose text{font:15px var(--osd);fill:var(--dim);text-anchor:middle}
#rose text.n{fill:var(--sun);font-size:18px}
#bAct{pointer-events:auto;position:absolute;right:18px;bottom:28px;width:96px;height:96px;border-radius:50%;border:3px solid var(--teal);
  background:rgba(25,227,197,.2);color:var(--ink);font:28px var(--osd);text-shadow:0 2px 0 rgba(0,0,0,.6)}
#bAct:active{background:rgba(25,227,197,.45)}
#bAct.dive{border-color:var(--sun);background:rgba(255,210,63,.28)}
#bAct.low{opacity:.4}
#stick{position:absolute;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:2px solid rgba(255,255,255,.28);background:rgba(255,255,255,.06);display:none}
#stick.on{display:block}
#stick i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:rgba(25,227,197,.6)}

#cap{position:absolute;left:0;right:0;bottom:15%;text-align:center;padding:0 22px;font-size:27px;line-height:1.05;color:var(--ink);
  text-shadow:0 2px 0 #000,0 0 14px #000,0 0 14px #000;pointer-events:none;opacity:0;transition:opacity .4s}
#cap.on{opacity:1}
#bSkip{position:absolute;right:12px;top:12px;margin:0;background:rgba(10,15,36,.65)}
.ov{position:absolute;inset:0;display:flex;background:rgba(6,9,24,.74);touch-action:pan-y;overflow:auto;padding:18px}
.panel{width:min(100%,380px);text-align:center;margin:auto}
.osd{position:absolute;left:16px;top:14px;font-size:24px;color:rgba(255,255,255,.75)}
.osd b{animation:blink 1.2s steps(2) infinite;font-weight:400}
@keyframes blink{50%{opacity:0}}
h1{font-family:var(--display);font-weight:400;margin:0;line-height:.92;font-size:clamp(46px,15vw,68px);color:var(--sun);
  text-shadow:3px 3px 0 var(--pink),6px 6px 0 var(--violet)}
h1 small{display:block;font:30px var(--osd);color:var(--teal);text-shadow:none;letter-spacing:8px;margin:6px 0 2px}
h2{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.05;margin:0 0 6px;color:var(--sun);text-shadow:3px 3px 0 var(--pink)}
p{font-size:23px;line-height:1.1;margin:10px 0;color:var(--dim)}
button{font-family:var(--osd);color:var(--ink);cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.big{display:block;width:100%;font:24px var(--display);padding:16px 10px;border:0;border-radius:10px;background:var(--pink);color:#fff;box-shadow:0 5px 0 #a3185c;margin:16px 0 12px}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #a3185c}
.ghost{background:none;border:2px solid rgba(255,255,255,.28);border-radius:8px;padding:10px 16px;font-size:23px;margin:4px}
.stats{display:flex;justify-content:space-between;gap:8px;font-size:22px;color:var(--ink);margin:4px 2px 10px}
.stats b{color:var(--sun);font-weight:400}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;width:100%;text-align:left;background:var(--panel);
  border:2px solid rgba(255,255,255,.2);border-radius:8px;padding:10px 12px;margin:8px 0;font-size:24px;line-height:1}
.row span{color:var(--dim);font-size:21px;grid-column:1}
.row em{font-style:normal;color:var(--sun);grid-column:2;grid-row:1 / span 2}
.row:disabled{opacity:.45;cursor:default}
.row.pick{border-color:var(--teal)}
.row.pick:active{background:rgba(25,227,197,.25)}
.sub{font-size:21px;color:var(--dim);margin:14px 0 2px;text-align:left}
.sub b{color:var(--sun);font-weight:400}
#menu{background:linear-gradient(rgba(6,9,24,.15),rgba(6,9,24,.7) 72%)}
#menu .panel{width:min(100%,340px)}
#menu h1{font-family:var(--osd);font-size:clamp(42px,13vw,56px);line-height:1;letter-spacing:6px;text-transform:uppercase;color:var(--ink);text-shadow:0 0 22px rgba(125,249,230,.45)}
#menu h1 span{display:block;font-size:.46em;letter-spacing:10px;color:var(--teal);margin:8px 0;text-shadow:none}
#menu .tag{margin:16px 0 28px}
.start{display:block;width:72%;margin:0 auto 24px;padding:12px;font:30px var(--osd);letter-spacing:3px;color:var(--ink);background:rgba(25,227,197,.12);border:2px solid var(--teal);border-radius:999px}
.start:active{background:rgba(25,227,197,.35)}
#menu .stats{justify-content:center;gap:20px;color:var(--dim);font-size:21px;margin-bottom:8px}
#menu .stats b{color:var(--ink)}
#menu .ctl{font-size:19px;line-height:1.15;margin:0 0 18px;color:var(--dim);max-width:300px;margin-left:auto;margin-right:auto}
.links{display:flex;justify-content:center;gap:8px}
.links .ghost{font-size:21px;padding:8px 14px;border-color:rgba(255,255,255,.18);color:var(--dim)}
@media (prefers-reduced-motion: reduce){ .osd b{animation:none} #toast{transition:none} }
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div class="scan"></div>

  <div id="hud" class="hide">
    <div class="top">
      <div><div id="hearts"></div><div id="night"></div></div>
      <div class="r"><div id="score">0</div><button id="bPause" aria-label="Pause">II</button></div>
    </div>
    <div class="bar2">
      <div id="ebar"><i></i></div>
      <div id="parts"><canvas width="72" height="72"></canvas><canvas width="72" height="72"></canvas><canvas width="72" height="72"></canvas><canvas width="72" height="72"></canvas><canvas width="72" height="72"></canvas><canvas width="72" height="72"></canvas></div>
    </div>
    <div id="bag"></div>
    <div id="combo"></div>
    <div id="phase"></div>
    <div id="toast"></div>
    <svg id="rose" viewBox="0 0 66 66" role="img" aria-label="Compass. North is the top of the screen.">
      <circle cx="33" cy="33" r="31" fill="rgba(10,15,36,.62)" stroke="rgba(255,255,255,.28)" stroke-width="2"/>
      <path d="M33 19 L38 33 L28 33 Z" fill="#ff3d9a"/><path d="M33 47 L38 33 L28 33 Z" fill="#9fb3c8"/>
      <circle cx="33" cy="33" r="2.2" fill="#eaf6ff"/>
      <text class="n" x="33" y="16">N</text><text x="33" y="61">S</text><text x="9" y="38">W</text><text x="57" y="38">E</text>
    </svg>
    <button id="bTalk" class="hide">Tap to talk</button>
    <button id="bAct">Dash</button>
    <div id="stick"><i></i></div>
  </div>

  <div id="cap"></div>
  <button id="bSkip" class="ghost hide">Skip</button>

  <div id="menu" class="ov">
    <div class="panel">
      <h1>Lost<span>in the</span>Pines</h1>
      <p class="tag">Find the radio. Call the ship. Get home.</p>
      <p class="ctl">Drag to move · Dash button or Space · E or “Tap to talk” near someone · P or pause for your leads</p>
      <button class="start" id="bPlay">Start</button>
      <div class="stats"><span>Rescues <b id="mBest">0</b></span><span>Best <b id="mTime">none</b></span></div>
      <div class="links"><button class="ghost" id="bShop">Upgrades</button><button class="ghost" id="bMute">Sound: on</button></div>
      <div id="shopBox" class="hide"><div class="sub">Stardust: <b id="mDust">0</b>. Upgrades stay with you between tries.</div><div id="shop"></div></div>
    </div>
  </div>

  <div id="perk" class="ov hide">
    <div class="panel">
      <h2 id="perkT">Piece safe</h2>
      <p id="perkP">Pick one.</p>
      <div id="perkList"></div>
    </div>
  </div>

  <div id="over" class="ov hide">
    <div class="panel">
      <h2 id="overH">They caught you</h2>
      <p id="overT"></p>
      <button class="big" id="bCont">Carry on from the clearing</button>
      <button class="ghost" id="bRetry">Start the night again</button>
      <button class="ghost" id="bMenu">Upgrades and menu</button>
    </div>
  </div>

  <div id="win" class="ov hide">
    <div class="panel">
      <h2>He made it home</h2>
      <p id="winT"></p>
      <button class="big" id="bAgain">Play again</button>
      <button class="ghost" id="bMenu2">Upgrades and menu</button>
    </div>
  </div>

  <div id="pause" class="ov hide">
    <div class="panel">
      <h2>Paused</h2>
      <div id="leads"></div>
      <button class="big" id="bResume">Keep playing</button>
      <button class="ghost" id="bQuit">End this run</button>
    </div>
  </div>
</div>

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const app=$('app'),cv=$('c'),ctx=cv.getContext('2d');
const lc=document.createElement('canvas'),lx=lc.getContext('2d');
const TAU=Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a),ri=n=>Math.floor(Math.random()*n),clamp=(v,a,b)=>v<a?a:v>b?b:v;
const d2=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const angd=(a,b)=>{let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;};
const calm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- save ---------- */
const KEY='lostpines_v1';
let save={dust:0,best:0,up:{heart:0,speed:0,energy:0},muted:false,seen:false};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==='object'){Object.assign(save,s);save.up=Object.assign({heart:0,speed:0,energy:0},s.up||{});
  for(const k of ['heart','speed','energy'])save.up[k]=Math.max(0,Math.min(3,save.up[k]|0));}}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}

/* ---------- audio ---------- */
let AC=null;
function audioInit(){if(AC){if(AC.state==='suspended')AC.resume();return;}try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
function tone(f,d,type,vol,slide){if(!AC||save.muted)return;try{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);}catch(e){}}
const seq=(fs,gap,d,type,vol)=>fs.forEach((f,i)=>setTimeout(()=>tone(f,d,type,vol),i*gap));
const sfx={
  candy:c=>tone(520*Math.pow(1.06,Math.min(c,16)),.07,'square',.045),
  part:()=>seq([523,659,784,1047],70,.12,'square',.06),
  bank:()=>seq([392,523,659,784],80,.14,'triangle',.09),
  dash:()=>tone(280,.18,'sawtooth',.05,520),
  alert:()=>seq([880,1175],90,.12,'square',.06),
  caught:()=>tone(240,.45,'sawtooth',.09,-190),
  dive:()=>tone(200,.28,'sine',.12,-140),
  siren:()=>seq([620,820,620,820],160,.16,'square',.035),
  win:()=>seq([523,659,784,1047,1319],90,.16,'triangle',.09),
  esc:()=>seq([660,990],80,.1,'triangle',.08),
  bike:()=>seq([880,880],120,.06,'square',.05),
  click:()=>tone(440,.05,'square',.04),
  bang:()=>{tone(120,.16,'square',.08,-70);noiseHit(.22,.2);}
};
function noiseHit(d,v){if(!AC||save.muted)return;try{const s=AC.createBufferSource(),g=AC.createGain(),lp=AC.createBiquadFilter(),t=AC.currentTime;s.buffer=noiseBuf();lp.type='lowpass';lp.frequency.value=1800;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(lp);lp.connect(g);g.connect(AC.destination);s.start(t,Math.random()*.7);s.stop(t+d+.02);}catch(e){}}
/* guard radios: static, garbled chatter and a sign-off beep, all synthesised */
let NB=null,HISS=null,hissV=-1;
function noiseBuf(){if(!NB){NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}return NB;}
function radio(kind,vol,pan){
  if(!AC||save.muted||!(vol>.01))return;
  try{
    const t=AC.currentTime+.01,out=AC.createGain();out.gain.value=vol*.16;
    const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=450;
    const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;
    hp.connect(lp);lp.connect(out);
    if(AC.createStereoPanner){const pn=AC.createStereoPanner();pn.pan.value=clamp(pan||0,-1,1);out.connect(pn);pn.connect(AC.destination);}else out.connect(AC.destination);
    const fast=kind==='spot',n=fast?5+ri(3):kind==='lost'?3+ri(2):2+ri(4),f0=fast?rand(170,220):rand(105,150);
    let at=t+.07;
    for(let i=0;i<n;i++){
      const d=fast?rand(.05,.09):rand(.07,.14),o=AC.createOscillator(),bp=AC.createBiquadFilter(),g=AC.createGain(),f=f0*rand(.85,1.25);
      o.type='sawtooth';o.frequency.setValueAtTime(f,at);o.frequency.linearRampToValueAtTime(f*rand(.85,1.2),at+d);
      bp.type='bandpass';bp.frequency.value=rand(600,2100);bp.Q.value=3;
      g.gain.setValueAtTime(.0001,at);g.gain.linearRampToValueAtTime(1,at+.015);g.gain.setValueAtTime(1,at+d*.7);g.gain.linearRampToValueAtTime(.0001,at+d);
      o.connect(bp);bp.connect(g);g.connect(hp);o.start(at);o.stop(at+d+.02);
      at+=d+(Math.random()<.25?rand(.06,.12):rand(.01,.03));
    }
    const end=at+.05,src=AC.createBufferSource(),ng=AC.createGain();src.buffer=noiseBuf();src.loop=true;
    ng.gain.setValueAtTime(.9,t);ng.gain.exponentialRampToValueAtTime(.22,t+.06);ng.gain.setValueAtTime(.22,end);ng.gain.linearRampToValueAtTime(.8,end+.02);ng.gain.linearRampToValueAtTime(.0001,end+.09);
    src.connect(ng);ng.connect(hp);src.start(t,Math.random()*.8);src.stop(end+.1);
    if(kind!=='idle'){const b=AC.createOscillator(),bg=AC.createGain();b.type='sine';b.frequency.value=fast?1250:880;bg.gain.setValueAtTime(.5,end);bg.gain.setValueAtTime(.5,end+.07);bg.gain.linearRampToValueAtTime(.0001,end+.09);b.connect(bg);bg.connect(out);b.start(end);b.stop(end+.1);}
    setTimeout(()=>{try{out.disconnect();}catch(e){}},(end-t+.5)*1000);
  }catch(e){}
}
/* faint static that swells as a guard gets close */
function hissSet(v){
  if(!AC)return;if(save.muted)v=0;if(Math.abs(v-hissV)<.002)return;hissV=v;
  try{if(!HISS){const s=AC.createBufferSource(),bp=AC.createBiquadFilter();HISS=AC.createGain();s.buffer=noiseBuf();s.loop=true;bp.type='bandpass';bp.frequency.value=2400;bp.Q.value=.7;HISS.gain.value=0;s.connect(bp);bp.connect(HISS);HISS.connect(AC.destination);s.start();}
    HISS.gain.setTargetAtTime(v,AC.currentTime,.15);}catch(e){}
}
/* ---------- music: an original score generated live, nothing sampled ---------- */
let MUS=null,REV=null,mStep=0,mNext=0,mMode='',mVol=-1,mLast=3;
const nf=m=>440*Math.pow(2,(m-69)/12);
const CH=[[38,50,57,64,65],[34,46,53,62,64],[43,50,58,64],[33,45,52,58,61]],SC=[74,76,77,81,82,85,86,88];
function musInit(){
  if(MUS||!AC)return;
  MUS=AC.createGain();MUS.gain.value=0;MUS.connect(AC.destination);
  REV=AC.createConvolver();const len=Math.floor(AC.sampleRate*3),ib=AC.createBuffer(2,len,AC.sampleRate);
  for(let c=0;c<2;c++){const d=ib.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);}
  REV.buffer=ib;const rg=AC.createGain();rg.gain.value=.55;REV.connect(rg);rg.connect(MUS);mNext=AC.currentTime+.1;
}
function mPad(f,t,d,v){const g=AC.createGain(),lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=Math.min(2200,f*3.2);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+d*.35);g.gain.setValueAtTime(v,t+d*.6);g.gain.linearRampToValueAtTime(.0001,t+d);
  for(const dt of[-7,6]){const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=f;o.detune.value=dt;o.connect(lp);o.start(t);o.stop(t+d+.05);}
  lp.connect(g);g.connect(MUS);g.connect(REV);}
function mBell(f,t,v){const o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),g2=AC.createGain();o.frequency.value=f;o2.frequency.value=f*4;g2.gain.value=.18;

function chat(a,kind,force){const d=d2(a.x,a.y,P.x,P.y),v=Math.pow(clamp(1-d/720,0,1),1.5);if(v<=.02)return;if(kind==='idle'&&!force&&G.rCd>0)return;G.rCd=.8;radio(kind,v*(kind==='idle'?.65:1),(a.x-P.x)/300);}
function updAgent(a,dt){
  const p=P;
  a.tired=Math.max(0,a.tired-dt);
  if(a.stun>0){a.stun-=dt;if(a.stun<=0){a.state='search';a.t=1.4;a.alert=0;}return;}
  const dx=p.x-a.x,dy=p.y-a.y,d=Math.hypot(dx,dy),range=a.range*ST.vis,vis=!p.hidden&&p.inv<=0&&G.phase!=='beam';
  let sees=false;
  if(vis)sees=a.state==='chase'?d<range*1.35:(d<range&&Math.abs(angd(Math.atan2(dy,dx),a.a))<a.half)||d<30;
  let sp=0,tx=a.tx,ty=a.ty;
  if(a.state==='chase'){
    if(sees){a.lx=p.x;a.ly=p.y;a.lose=0;}else a.lose+=dt;
    a.ct+=dt;tx=a.lx;ty=a.ly;sp=a.ct<2?a.cs:a.cw; // a hard sprint, then they run out of breath
    if(sees&&d<24){caught();return;}
    if(a.lose>1.6||a.ct>9||(!sees&&d2(a.x,a.y,tx,ty)<16)){a.state='search';a.t=2.6;a.alert=0;a.tired=8;escaped();chat(a,'lost');return;}
  }else{
    if(sees){a.alert+=dt*(1.3+2.4*(1-d/range));a.lx=p.x;a.ly=p.y;
      if(a.alert>=1){a.state='chase';a.lose=0;a.ct=a.tired>0?2:0;a.alert=1;sfx.alert();chat(a,'spot');return;}
      if(a.alert>.3&&a.state!=='sus'){a.state='sus';chat(a,'idle',true);}
    }else a.alert=Math.max(0,a.alert-dt*.45);
    if(a.state==='sus'){tx=a.lx;ty=a.ly;sp=a.ps*1.3;if(d2(a.x,a.y,tx,ty)<18){sp=0;if(a.alert<=.05){a.state='search';a.t=1.6;}}}
    else if(a.state==='search'){a.t-=dt;a.a+=dt*2.2*a.spin;a.rt-=dt;if(a.rt<=0){a.rt=rand(2,4);chat(a,'idle');}if(a.t<=0){a.state='patrol';pickWp(a);}}
    else{a.rt-=dt;if(a.rt<=0){a.rt=rand(4,9);chat(a,'idle');}
      if(a.guard){tx=a.px;ty=a.py;if(d2(a.x,a.y,tx,ty)<14){sp=0;a.a+=clamp(angd(a.ga+Math.sin(T*.55+a.ph)*1.25,a.a),-dt*2.2,dt*2.2);}else sp=a.ps;}
      else{sp=a.ps;a.wpT-=dt;if(d2(a.x,a.y,tx,ty)<18||a.wpT<=0){pickWp(a);tx=a.tx;ty=a.ty;}}}
  }
  if(sp>0){const mx=tx-a.x,my=ty-a.y,m=Math.hypot(mx,my)||1;
    a.a+=clamp(angd(Math.atan2(my,mx),a.a),-dt*5,dt*5);
    if(a.state==='patrol')a.a+=Math.sin(T*1.6+a.ph)*dt*.9;
    if(wade(a.x,a.y))sp*=.7;
    a.x+=mx/m*sp*dt;a.y+=my/m*sp*dt;a.walk+=dt*sp*.07;collide(a,11);}
}
function updCar(c,dt){

function updLamp(l,dt){const p=P;if(l.cam){const rp=W.npcs.find(q=>q.id==='reporter');if(rp.st===1&&rp.s2)l.a+=clamp(angd(Math.atan2(p.y-l.y,p.x-l.x),l.a),-dt*2.5,dt*2.5);else l.a=l.a0+l.amp*Math.sin(T*l.sp);return;}

const HINTS=[[5,'Drag anywhere to move.'],[11,'People in the forest have seen the pieces. Walk up to anyone with a yellow ! over their head and tap “Tap to talk”.'],[18,'Keep out of the light beams.'],[26,'Bushes hide you. Burrows are tunnels to somewhere else.'],[31,'Cross the river by the road bridges. The water will sweep you away.'],[36,'Carry one piece at a time. A gold arrow points the way home.'],[46,'Pause at any time to read your leads.']];
function update(dt){
  const w=W,p=P,c=w.clear;G.time+=dt;
  p.dashT=Math.max(0,p.dashT-dt);p.dashCd=Math.max(0,p.dashCd-dt);p.inv=Math.max(0,p.inv-dt);p.burrowCd=Math.max(0,p.burrowCd-dt);p.diveT=Math.max(0,p.diveT-dt);
  if(p.bikeT>0){p.bikeT-=dt;if(p.bikeT<=0)burst(p.x,p.y,8,'#e5484d',80,.5);}
  if(G.comboT>0){G.comboT-=dt;if(G.comboT<=0)G.combo=0;}
  G.escCd=Math.max(0,G.escCd-dt);
  if(G.phase==='beam'){p.beamT-=dt;p.x+=(c.x-p.x)*Math.min(1,dt*5);p.y+=(c.y-p.y)*Math.min(1,dt*5);p.moving=false;if(p.beamT<=0){startOutro();return;}}
  else{
    let ix=joy.x,iy=joy.y;
    if(keys.ArrowLeft||keys.a)ix-=1;if(keys.ArrowRight||keys.d)ix+=1;if(keys.ArrowUp||keys.w)iy-=1;if(keys.ArrowDown||keys.s)iy+=1;
    let m=Math.hypot(ix,iy);if(m>1){ix/=m;iy/=m;m=1;}if(m<.14){ix=iy=0;m=0;}
    if(p.dashT>0){if(m===0){ix=Math.cos(p.face);iy=Math.sin(p.face);}else{ix/=m;iy/=m;}m=1;}
    // falling in the river costs a heart; the current carries him downstream and he can barely steer until he reaches a bank
    const wet=wade(p.x,p.y);
    if(wet&&!p.inWater){p.inWater=true;p.bikeT=0;p.dashT=0;burst(p.x,p.y-6,18,'#9fd8ee',160,.7);sfx.dive();
      if(!(p.dunkCd>0)){p.dunkCd=5;G.hearts--;flash=1;if(!calm)shake=8;toast('The river sweeps you away! Cross by the bridges.',2.8);if(G.hearts<=0){gameOver('river');return;}}}
    if(!wet&&p.inWater){p.inWater=false;p.cold=6;burst(p.x,p.y-6,10,'#9fd8ee',90,.5);}
    p.holo=Math.max(0,(p.holo||0)-dt);p.dunkCd=Math.max(0,(p.dunkCd||0)-dt);p.cold=Math.max(0,(p.cold||0)-dt);
    const sp=ST.speed*(p.bikeT>0?1.7:1)*(p.dashT>0?2.7:1)*((p.carry.length||G.radio===1)&&p.bikeT<=0?.88:1)*(wet?.34:p.cold>0?.78:1); // a piece of radio is heavy; wet and cold is slow
    p.x+=ix*sp*dt;p.y+=iy*sp*dt;if(wet){p.y+=175*dt;p.x+=Math.sin(T*3)*30*dt;}
    p.moving=m>0;p.idle=m>0?0:(p.idle||0)+dt;
    if(m>0){p.face=Math.atan2(iy,ix);p.walk+=dt*sp*.055*m;}
    collide(p,12);
    if(p.cold>0&&Math.random()<.3)parts.push({x:p.x+rand(-10,10),y:p.y-22,vx:0,vy:10,l:.5,m:.5,c:'#9fd8ee',s:2.5});
    if(p.inWater&&Math.random()<.5)parts.push({x:p.x+rand(-8,8),y:p.y,vx:rand(-30,30),vy:rand(-60,-20),l:.4,m:.4,c:'#9fd8ee',s:3});
    if(p.dashT>0&&Math.random()<.7)parts.push({x:p.x,y:p.y-14,vx:rand(-20,20),vy:rand(-20,20),l:.35,m:.35,c:'#7df9e6',s:rand(3,6)});
  }
  p.energy=Math.min(ST.maxE,p.energy+4*dt);
  // hiding
  let nb=null;for(const b of w.bushes)if(d2(p.x,p.y,b.x,b.y)<b.r-6){nb=b;break;}
  if(nb&&nb!==p.inBush){p.blown=w.agents.some(a=>a.state==='chase'&&a.stun<=0&&d2(a.x,a.y,p.x,p.y)<110);burst(nb.x,nb.y-20,6,'#66b877',70,.5);}
  p.inBush=nb;p.hidden=p.diveT>0||(!!nb&&!p.blown);
  // candy
  for(let i=w.candy.length-1;i>=0;i--){const k=w.candy[i],d=d2(p.x,p.y-8,k.x,k.y);
    if(d<ST.magnet&&d>20){k.x+=(p.x-k.x)/d*260*dt;k.y+=(p.y-8-k.y)/d*260*dt;}
    if(d<22){w.candy.splice(i,1);G.bag++;if(!G.sweet){G.sweet=1;toast('Halloween candy! It gives him energy.',2.4);}G.combo++;G.comboT=ST.comboT;const mult=Math.min(8,1+Math.floor(G.combo/5));G.score+=10*mult;p.energy=Math.min(ST.maxE,p.energy+ST.candyE);
      sfx.candy(G.combo);burst(k.x,k.y,5,CANDY[k.c],80,.4);if(G.combo%5===0&&mult>1)ftext(p.x,p.y-52,'×'+mult+' combo!','#ff3d9a');}}
  // parts
  for(const pt of w.parts)if(!pt.hid&&!pt.taken&&!pt.banked&&d2(p.x,p.y,pt.x,pt.y)<30){

/* ---------- input ---------- */
const stick=$('stick'),knob=stick.firstElementChild;

app.addEventListener('pointerdown',e=>{
  audioInit();if(state!=='play'||e.target.closest('button')||joy.id!==null)return;
  const r=app.getBoundingClientRect();joy.id=e.pointerId;joy.ox=e.clientX;joy.oy=e.clientY;joy.x=joy.y=0;
  stick.style.left=(e.clientX-r.left)+'px';stick.style.top=(e.clientY-r.top)+'px';knob.style.transform='';stick.classList.add('on');
  try{stick.setPointerCapture(e.pointerId);}catch(err){}
  e.preventDefault();
});
app.addEventListener('pointermove',e=>{
  if(e.pointerId!==joy.id)return;let dx=e.clientX-joy.ox,dy=e.clientY-joy.oy;const m=Math.hypot(dx,dy),R=48;
  if(m>R){dx=dx/m*R;dy=dy/m*R;}joy.x=dx/R;joy.y=dy/R;knob.style.transform='translate('+dx+'px,'+dy+'px)';
});
const pe=e=>{if(e.pointerId===joy.id){try{stick.releasePointerCapture(e.pointerId);}catch(err){}joyEnd();}};

window.addEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=true;
  if(k===' '&&state==='play'){e.preventDefault();audioInit();act();}
  if((k==='e'||k==='Enter')&&state==='play'){e.preventDefault();audioInit();talk();}
  if((k===' '||k==='Enter')&&state==='intro'&&CS.t>.5){e.preventDefault();beginPlay();}
  if((k==='Escape'||k==='p')&&(state==='play'||state==='pause'))setPause(state==='play');});

$('bSkip').onclick=()=>{if(state==='intro')beginPlay();};
$('bShop').onclick=()=>{$('shopBox').classList.toggle('hide');audioInit();sfx.click();};

/* ---------- loop ---------- */
let last=0;
function frame(now){
  const dt=Math.min(.034,Math.max(0,(now-last)/1000)||0);last=now;T+=dt;
  if(state==='play'){update(dt);if(fadeA>0&&state==='play')fadeA=Math.max(0,fadeA-dt*1.1);}
  else if(state==='intro'||state==='outro')cutscene(dt);
  else if(state==='menu'&&W){const vw=VW/Z,vh=VH/Z,c=W.clear;cam.x=clamp(c.x-vw/2+Math.cos(T*.13)*170,0,Math.max(0,W.w-vw));cam.y=clamp(c.y-vh/2+Math.sin(T*.17)*120,0,Math.max(0,W.h-vh));
    for(const a of W.agents){a.state='patrol';a.alert=0;}}

}
resize();toMenu();
window.__lp={frame,start:startRun,act,talk,joy,pick:pickPerk,skip:beginPlay,get CS(){return CS;},get state(){return state;},get G(){return G;},get P(){return P;},get W(){return W;}};
